<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GUIDE – Blind Navigation Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00ff88;--yellow:#ffd700;--red:#ff4444;--blue:#60a5fa;
  --orange:#ff8c00;--bg:#050508;--card:#0d0d14;--border:rgba(255,255,255,.07)
}
html,body{min-height:100%;background:var(--bg);color:#fff;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}

/* ── HEADER ── */
#hdr{width:100%;max-width:480px;padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;flex-direction:column}
.logo-sub{font-size:.55rem;color:rgba(255,255,255,.2);letter-spacing:.4em;text-transform:uppercase}
.logo-title{font-size:1.6rem;letter-spacing:.22em;color:#fff;line-height:1}
#mode-tabs{display:flex;gap:6px}
.tab{padding:5px 12px;border-radius:20px;font-size:.6rem;letter-spacing:.12em;border:1px solid var(--border);background:transparent;color:rgba(255,255,255,.3);cursor:pointer;transition:all .2s;font-family:'Courier New',monospace;touch-action:manipulation}
.tab.active{background:var(--green);color:#050508;border-color:var(--green);font-weight:700}
.tab.danger-tab.active{background:var(--red);border-color:var(--red)}
.tab.door-tab.active{background:var(--blue);border-color:var(--blue)}

/* ── CAMERA ── */
#cam{position:relative;width:calc(100% - 24px);max-width:480px;height:290px;background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--border);margin:8px 12px 0;flex-shrink:0}
#vid{width:100%;height:100%;object-fit:cover;display:none}
#cvs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* idle */
#idle-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#idle-icon{font-size:3.5rem}
#idle-msg{font-size:.75rem;color:rgba(255,255,255,.25);text-align:center;line-height:1.7;max-width:240px;letter-spacing:.08em}
#heard-text{font-size:.82rem;color:rgba(255,255,255,.5);font-style:italic;text-align:center;display:none;padding:0 16px}

/* scan line */
#sline{position:absolute;left:0;right:0;height:2px;display:none;animation:swp 2s linear infinite;pointer-events:none}
@keyframes swp{0%{top:0%}100%{top:100%}}
.corner-bracket{position:absolute;width:22px;height:22px;border-style:solid;display:none}
.cb-tl{top:10px;left:10px;border-color:rgba(255,255,255,.3) transparent transparent rgba(255,255,255,.3);border-width:2px 0 0 2px}
.cb-tr{top:10px;right:10px;border-color:rgba(255,255,255,.3) rgba(255,255,255,.3) transparent transparent;border-width:2px 2px 0 0}
.cb-bl{bottom:10px;left:10px;border-color:transparent transparent rgba(255,255,255,.3) rgba(255,255,255,.3);border-width:0 0 2px 2px}
.cb-br{bottom:10px;right:10px;border-color:transparent rgba(255,255,255,.3) rgba(255,255,255,.3) transparent;border-width:0 2px 2px 0}

/* hazard banner — appears over camera */
#hazard-banner{
  position:absolute;bottom:0;inset-x:0;
  padding:12px 16px;display:none;
  font-size:.82rem;line-height:1.5;font-weight:600;
  backdrop-filter:blur(4px);
}

/* ── INSTRUCTOR CARD ── */
#instructor{
  width:calc(100% - 24px);max-width:480px;margin:8px 12px 0;
  border-radius:16px;padding:14px 16px;display:none;
  flex-direction:column;gap:8px;border:1px solid;
  transition:background .3s,border-color .3s;
}
#inst-type{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
#inst-arrow{font-size:2.2rem;line-height:1;text-align:center}
#inst-text{font-size:.95rem;line-height:1.5;font-weight:500}

/* ── DIRECTION BAR ── */
#dir-bar{width:calc(100% - 24px);max-width:480px;margin:6px 12px 0;display:none;gap:5px}
.dzone{flex:1;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(255,255,255,.22);letter-spacing:.1em;text-transform:uppercase;transition:all .25s}
.dzone.on-green{background:rgba(0,255,136,.14);border-color:rgba(0,255,136,.45);color:var(--green);font-weight:700}
.dzone.on-yellow{background:rgba(255,215,0,.14);border-color:rgba(255,215,0,.45);color:var(--yellow);font-weight:700}
.dzone.on-red{background:rgba(255,68,68,.2);border-color:rgba(255,68,68,.5);color:var(--red);font-weight:700}
.dzone.on-blue{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.45);color:var(--blue);font-weight:700}

/* ── DISTANCE BAR ── */
#dist-row{width:calc(100% - 24px);max-width:480px;margin:5px 12px 0;display:none}
#dist-labels{display:flex;justify-content:space-between;font-size:.58rem;color:rgba(255,255,255,.18);margin-bottom:4px}
#dist-bg{height:5px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
#dist-fill{height:100%;border-radius:4px;width:0%;transition:width .4s;background:linear-gradient(90deg,#ff4444,#ffd700,#00ff88)}
#dist-label-val{font-size:.62rem;color:rgba(255,255,255,.3);margin-top:3px;text-align:center;letter-spacing:.08em}

/* ── STATUS ── */
#sbar{width:calc(100% - 24px);max-width:480px;margin:7px 12px 0;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:flex-start;gap:9px}
#dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);flex-shrink:0;margin-top:4px;transition:all .3s}
#dot.g{background:var(--green);box-shadow:0 0 8px var(--green)}
#dot.y{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:blk 1s ease infinite}
#dot.b{background:var(--blue);box-shadow:0 0 8px var(--blue)}
#dot.r{background:var(--red);box-shadow:0 0 10px var(--red);animation:blk .6s ease infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.25}}
#stxt{font-size:.7rem;color:rgba(255,255,255,.38);line-height:1.55}

/* ── PROGRESS ── */
#prog{width:calc(100% - 24px);max-width:480px;margin:5px 12px 0;display:none}
#pbg{height:3px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
#pfill{height:100%;background:var(--green);width:0%;transition:width .3s;border-radius:4px}
#plbl{font-size:.58rem;color:rgba(255,255,255,.2);margin-top:4px;letter-spacing:.1em}

/* ── BUTTONS ── */
#btns{width:calc(100% - 24px);max-width:480px;margin:9px 12px 0;padding-bottom:28px;display:flex;flex-direction:column;gap:8px}
.bp{width:100%;padding:20px;border-radius:15px;border:none;cursor:pointer;color:#050508;font-family:'Courier New',monospace;font-size:.98rem;font-weight:700;letter-spacing:.18em;transition:transform .12s,opacity .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bp:active{transform:scale(.96)}.bp:disabled{opacity:.32;cursor:not-allowed;transform:none}
.bp-green{background:linear-gradient(135deg,#00ff88,#00cc66);box-shadow:0 5px 28px rgba(0,255,136,.24)}
.bp-red{background:linear-gradient(135deg,#ff4444,#cc2222);box-shadow:0 5px 28px rgba(255,68,68,.3)}
.bp-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6);box-shadow:0 5px 28px rgba(96,165,250,.3)}
.bs{padding:14px;border-radius:13px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--border);color:rgba(255,255,255,.35);font-family:'Courier New',monospace;font-size:.76rem;letter-spacing:.16em;transition:transform .12s;touch-action:manipulation}
.bs:active{transform:scale(.97)}
#row-found{display:none;gap:8px}
#row-found .bp{flex:1;font-size:.72rem;padding:15px 5px}
#row-found .bs{padding:15px 13px}
#li-wrap{display:none;padding:16px;border-radius:15px;border:2px solid rgba(96,165,250,.35);background:rgba(96,165,250,.05);align-items:center;justify-content:center;gap:10px}
#li-wrap span{color:var(--blue);letter-spacing:.2em;font-size:.78rem}
.dw{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:wv .9s ease-in-out infinite}
.dw:nth-child(2){animation-delay:.15s}.dw:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(1);opacity:.5}50%{transform:scaleY(2.1);opacity:1}}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONSTANTS & STATE
// ═══════════════════════════════════════════════════════════════════
const SYNONYMS = {
  'phone':'cell phone','mobile':'cell phone','smartphone':'cell phone','iphone':'cell phone',
  'water bottle':'bottle','water':'bottle','plastic bottle':'bottle',
  'mug':'cup','glass':'cup',
  'sofa':'couch','settee':'couch',
  'table':'dining table','desk':'dining table',

  'computer':'laptop','notebook':'laptop',

  'fridge':'refrigerator','freezer':'refrigerator',

  'bag':'backpack','purse':'handbag',
  'teddy':'teddy bear','stuffed animal':'teddy bear',
  'plane':'airplane','bike':'bicycle','motorbike':'motorcycle',
  'knife':'knife','fork':'fork','spoon':'spoon',
}
const ALL_COCO=['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush']

let model = null
let appMode = 'find'      // 'find' | 'stair' | 'door'
let target = ''
let isActive = false
let mediaStream = null
let scanTimer = null
let recognition = null
let lastSpoken = ''
let lastInstMsg = ''
let lastSpeakTime = 0
const SPEAK_GAP = 2600

const vid = document.getElementById('vid')
const cvs = document.getElementById('cvs')
const oc  = cvs.getContext('2d')

// ═══════════════════════════════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════════════════════════════
function speak(text, rate=1.08, force=false) {
  const now = Date.now()
  if (!force && now - lastSpeakTime < SPEAK_GAP) return
  if (!force && speechSynthesis.speaking) return
  lastSpeakTime = now
  speechSynthesis.cancel()
  const u = new SpeechSynthesisUtterance(text)
  u.rate = rate; u.pitch = 1.05; u.volume = 1
  speechSynthesis.speak(u)
  lastSpoken = text
}
function repeatLast() { if (lastSpoken) { speechSynthesis.cancel(); speak(lastSpoken, 1.0, true) } }

// ═══════════════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════════════
function setStatus(msg, cls='') {
  document.getElementById('stxt').textContent = msg
  document.getElementById('dot').className = cls
}
function showProg(p, l) {
  document.getElementById('prog').style.display = 'block'
  document.getElementById('pfill').style.width = p + '%'
  document.getElementById('plbl').textContent = l
}
function hideProg() { document.getElementById('prog').style.display = 'none' }

function setScanVisuals(on, color='rgba(0,255,136,.7)') {
  const sl = document.getElementById('sline')
  sl.style.display = on ? 'block' : 'none'
  sl.style.background = `linear-gradient(90deg,transparent,${color} 50%,transparent)`
  document.querySelectorAll('.corner-bracket').forEach(e => e.style.display = on ? 'block' : 'none')
}

function setUI(state) {
  // state: idle | listening | scanning | found | notfound
  document.getElementById('btn-main').style.display   = ['idle','notfound'].includes(state) ? 'block' : 'none'
  document.getElementById('li-wrap').style.display    = state==='listening' ? 'flex' : 'none'

  document.getElementById('dir-bar').style.display    = scanning ? 'flex' : 'none'

// ═══════════════════════════════════════════════════════════════════
// SPEECH RECOGNITION (find mode)
// ═══════════════════════════════════════════════════════════════════
function resolveTarget(text) {
  const lower = text.toLowerCase().trim()
  for (const k of Object.keys(SYNONYMS).sort((a,b)=>b.length-a.length))
    if (lower.includes(k)) return SYNONYMS[k]
  for (const lbl of ALL_COCO)
    if (lower.includes(lbl)) return lbl
  const pats = [
    /(?:looking for|find|where(?:'s| is)|locate|i need) (?:my |the |a |an )?(.+)/,
    /(?:my |the |a |an )(.+)/,
  ]
  for (const p of pats) {
    const m = lower.match(p)
    if (m?.[1]) {
      const noun = m[1].replace(/[?.!,].*$/,'').trim()
      for (const lbl of ALL_COCO)
        if (lbl.includes(noun)||noun.includes(lbl)) return lbl
      return noun
    }
  }
  return lower
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition
  if (!SR) { speak('Please use Chrome or Edge browser.', 1.0, true); return }
  setUI('listening')
  setStatus('Listening…', 'b')
  setIdleScreen('👂', 'Listening… say what you are looking for')
  speak('Listening. What are you looking for?', 1.0, true)

  recognition = new SR()
  recognition.continuous = false
  recognition.interimResults = true
  recognition.lang = 'en-US'
  let finalText = ''

  recognition.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('')
    const ht = document.getElementById('heard-text')
    ht.style.display = 'block'
    ht.textContent = `"${t}"`
    finalText = t
  }
  recognition.onend = () => {
    if (!finalText) {
      speak('I did not hear you. Tap and try again.', 1.0, true)
      setStatus('Nothing heard — tap to try again', '')
      setUI('idle')
      setIdleScreen('🔍', 'Tap the button and say what you are looking for')
      return
    }
    target = resolveTarget(finalText)
    speak(`Looking for ${target}. Opening camera now.`, 1.1, true)
    setStatus(`Target: ${target.toUpperCase()} — opening camera…`, 'y')
    startCamera()
  }
  recognition.onerror = () => {
    speak('Could not hear. Tap and try again.', 1.0, true)
    setStatus('Could not hear — tap to try again', '')
    setUI('idle')
  }
  recognition.start()
}

// ═══════════════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════════════
async function startCamera() {
  try {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
      })
    } catch {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video:true })
    }
    vid.srcObject = mediaStream
    vid.style.display = 'block'
    document.getElementById('idle-screen').style.display = 'none'
    await vid.play()
    isActive = true

    const modeMessages = {
      find:  `Scanning for ${target}. Move your phone slowly — I will guide you.`,
      stair: 'Stair detection active. Hold your phone level and walk slowly. I will warn you.',
      door:  'Door detection active. Point your phone forward and move slowly.',
    }
    const modeDots = { find:'y', stair:'r', door:'b' }

    setUI('scanning')
    lastInstMsg = ''
    lastSpeakTime = 0
    setStatus(modeMessages[appMode], modeDots[appMode])
    speak(modeMessages[appMode], 1.0, true)

    await new Promise(r=>setTimeout(r, 800))

    let frame = 0, noDetectCount = 0
    const MAX_FRAMES = appMode==='find' ? 60 : 9999 // stair/door run forever

    async function doScan() {
      if (!isActive) return
      frame++

      if (appMode === 'find') {
        const result = await detectObject()
        if (result === 'FOUND') return
        if (!result) {
          noDetectCount++
          if (noDetectCount % 4 === 0) {
            setInstructor('🔄', `No ${target} visible — keep moving`, 'rgba(255,255,255,.04)', 'rgba(255,255,255,.1)', '🔍 SEARCHING')
            if (noDetectCount >= 8) {
              speak(`Still no ${target}. Try turning around or a different area.`, 1.0, true)
              noDetectCount = 0
            }
          }
        } else {
          noDetectCount = 0
        }
        if (frame >= MAX_FRAMES) {
          stopCameraStream()
          setUI('notfound')
          const msg = `Could not find ${target}. Try a different room or angle.`
          setStatus(msg, 'r')
          speak(msg, 1.0, true)
          setIdleScreen('❌', msg)
          document.getElementById('idle-screen').style.display = 'flex'
          return
        }
      } else if (appMode === 'stair') {
        await detectStairs()
      } else if (appMode === 'door') {
        await detectDoor()
      }

      scanTimer = setTimeout(doScan, appMode==='find' ? 1400 : 1200)
    }
    doScan()

  } catch(e) {
    console.error(e)
    setStatus('Camera access denied — please allow camera', 'r')
    speak('Camera access denied. Please allow camera permission.', 1.0, true)
    setUI('idle')
  }
}

function stopCameraStream() {
  isActive = false
  clearTimeout(scanTimer)
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null }
  vid.style.display = 'none'; vid.srcObject = null
  setScanVisuals(false)
  oc.clearRect(0,0,cvs.width,cvs.height)
  hideHazard()
  document.getElementById('instructor').style.display = 'none'
  document.getElementById('dir-bar').style.display = 'none'
  document.getElementById('dist-row').style.display = 'none'
}

function stopAll() {
  stopCameraStream()
  try { if(recognition) recognition.abort() } catch {}
  speechSynthesis.cancel()
  setUI('idle')
  setStatus('Stopped', '')
  setIdleScreen('🧭', 'Select a mode above, then tap the button')
}

function resetToIdle() {
  stopAll()
  target = ''; lastSpoken = ''; lastInstMsg = ''
  const icons = {find:'🔍', stair:'🪜', door:'🚪'}
  const msgs  = {
    find:'Tap the button and say what you are looking for',
    stair:'Tap the button — I will warn you about stairs',
    door:'Tap the button — I will detect doors for you',
  }
  setIdleScreen(icons[appMode], msgs[appMode])
  setStatus('Ready — tap the button', 'g')
  speak('Ready.', 1.0, true)
}

// ═══════════════════════════════════════════════════════════════════
// CAPTURE FRAME AS BASE64
// ═══════════════════════════════════════════════════════════════════
function captureBase64(w=640, h=480) {
  const tmp = document.createElement('canvas')
  tmp.width = w; tmp.height = h
  tmp.getContext('2d').drawImage(vid, 0, 0, w, h)
  return tmp.toDataURL('image/jpeg', 0.82).split(',')[1]
}

// ═══════════════════════════════════════════════════════════════════
// OBJECT DETECTION (COCO-SSD) — FIND MODE
// ═══════════════════════════════════════════════════════════════════
async function detectObject() {
  if (!model || vid.readyState < 2 || !vid.videoWidth) return false
  cvs.width = vid.videoWidth; cvs.height = vid.videoHeight
  oc.clearRect(0,0,cvs.width,cvs.height)

  let preds
  try { preds = await model.detect(vid) } catch(e) { return false }

  // Draw all faint
  for (const p of preds) {
    const [x,y,w,h] = p.bbox
    oc.strokeStyle='rgba(255,255,255,.08)'; oc.lineWidth=1
    oc.strokeRect(x,y,w,h)
  }

  const tgt = target.toLowerCase()
  const matches = preds.filter(p => {
    const cls = p.class.toLowerCase()
    return cls===tgt || cls.includes(tgt) || tgt.includes(cls)
  })

  if (!matches.length) return false

  const best = matches.reduce((a,b)=>a.score>b.score?a:b)
  const [bx,by,bw,bh] = best.bbox
  const vw=cvs.width, vh=cvs.height
  const cx=bx+bw/2, area=(bw*bh)/(vw*vh)

  const zone = cx < vw*0.35 ? 'left' : cx > vw*0.65 ? 'right' : 'center'
  const distRatio = Math.min(1, Math.max(0, (Math.sqrt(area)-0.1)/0.5))

  // Draw box
  oc.save()
  oc.shadowBlur=16; oc.shadowColor='#00ff88'
  oc.strokeStyle='#00ff88'; oc.lineWidth=3
  oc.strokeRect(bx,by,bw,bh)
  oc.fillStyle='rgba(0,255,136,.09)'; oc.fillRect(bx,by,bw,bh)
  const arrowChar = zone==='left'?'←':zone==='right'?'→':'↑'
  oc.font=`bold ${Math.min(60,Math.max(20,bw/2.5))}px sans-serif`
  oc.fillStyle='rgba(0,255,136,.8)'; oc.shadowBlur=0
  const aw=oc.measureText(arrowChar).width
  oc.fillText(arrowChar, bx+bw/2-aw/2, by+bh/2+12)
  // Label
  const lbl=`${best.class} ${Math.round(best.score*100)}%`
  oc.font='bold 13px Courier New'
  const tw=oc.measureText(lbl).width+14
  oc.fillStyle='#00ff88'
  oc.beginPath(); oc.roundRect?oc.roundRect(bx,by-27,tw,24,5):oc.rect(bx,by-27,tw,24); oc.fill()
  oc.fillStyle='#050508'; oc.fillText(lbl,bx+7,by-9)
  oc.restore()

  // Instructor
  const dirWords = { left:`Turn left — ${best.class} is to your left`, center:`Go straight — ${best.class} is ahead`, right:`Turn right — ${best.class} is to your right` }
  const distLabels = ['Far away','A few steps','Getting closer','Nearby','Very close','Right here!']
  const distIdx = Math.min(5, Math.floor(distRatio*6))
  const distWord = distLabels[distIdx]
  const emojiArrow = { left:'⬅️', center:'⬆️', right:'➡️' }
  const fullMsg = `${dirWords[zone]}. ${distWord}.`

  setInstructor(emojiArrow[zone], fullMsg, 'rgba(0,255,136,.06)', 'rgba(0,255,136,.25)', '🔍 OBJECT FINDER')
  setZone(zone, 'on-green')
  setDist(distRatio, distWord)

  if (fullMsg !== lastInstMsg) { speak(fullMsg, 1.05); lastInstMsg=fullMsg }

  // FOUND check
  if (area > 0.16 && zone === 'center') {
    const foundMsg = `You found it! ${best.class} is right in front of you!`
    speak(foundMsg, 0.9, true)
    setStatus(foundMsg, 'g')
    oc.save(); oc.strokeStyle='#00ff88'; oc.lineWidth=5; oc.shadowBlur=30; oc.shadowColor='#00ff88'; oc.strokeRect(bx,by,bw,bh); oc.restore()
    setTimeout(() => {
      stopCameraStream()
      setUI('found')
      setStatus(foundMsg, 'g')
      setIdleScreen('✅', foundMsg)
      document.getElementById('idle-screen').style.display = 'flex'
    }, 1200)
    return 'FOUND'
  }
  return true
}

// ═══════════════════════════════════════════════════════════════════
// STAIR DETECTION — Claude Vision API
// ═══════════════════════════════════════════════════════════════════
let stairCooldown = false
let lastStairState = null

async function detectStairs() {
  if (!vid.videoWidth || stairCooldown) return
  cvs.width=vid.videoWidth; cvs.height=vid.videoHeight
  oc.clearRect(0,0,cvs.width,cvs.height)

  const b64 = captureBase64()
  let result = null

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:200,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:b64 } },
            { type:'text', text:`You are an AI assistant for BLIND people. Analyze this camera frame for STAIRS only.

Respond with ONLY this JSON (no other text):
{"stairs":true/false,"direction":"up"/"down"/"unknown","position":"left"/"center"/"right"/"full","proximity":"immediate"/"close"/"far","warning":"short warning message for blind person max 10 words"}

If no stairs visible: {"stairs":false}
Be very sensitive — even partial stairs count.` }
          ]
        }]
      })
    })
    const data = await resp.json()
    const txt = data.content?.[0]?.text?.trim() || ''
    result = JSON.parse(txt.replace(/```json|```/g,'').trim())
  } catch(e) {
    // API fail — silent, keep scanning
    return
  }

  if (!result) return

  if (result.stairs) {
    // Draw warning overlay on canvas
    oc.save()
    oc.fillStyle = 'rgba(255,68,68,.15)'
    oc.fillRect(0,0,cvs.width,cvs.height)

    // Warning stripes at bottom
    const stripeH = cvs.height * 0.18
    for (let i=0;i<8;i++) {
      oc.fillStyle = i%2===0 ? 'rgba(255,68,68,.4)' : 'rgba(255,215,0,.35)'
      oc.fillRect(i*(cvs.width/8), cvs.height-stripeH, cvs.width/8, stripeH)
    }

    // Warning icon
    oc.font = `bold ${cvs.height*0.12}px sans-serif`
    oc.fillStyle = '#fff'
    oc.shadowBlur = 12; oc.shadowColor = '#ff4444'
    oc.fillText('⚠️', cvs.width/2 - 40, cvs.height/2)
    oc.restore()

    const proxColor = result.proximity==='immediate' ? 'rgba(255,0,0,.85)' : result.proximity==='close' ? 'rgba(200,60,0,.8)' : 'rgba(180,120,0,.75)'
    showHazard(`⚠️ STAIRS ${result.direction==='up'?'GOING UP':result.direction==='down'?'GOING DOWN':'AHEAD'} — ${result.warning}`, proxColor, '#fff')

    const emojiDir = { up:'⬆️', down:'⬇️', unknown:'⚠️' }
    setInstructor(
      emojiDir[result.direction]||'⚠️',
      `STAIRS DETECTED! ${result.warning}. ${result.proximity==='immediate'?'STOP IMMEDIATELY!':result.proximity==='close'?'Slow down, stairs very close.':'Stairs ahead, proceed carefully.'}`,
      'rgba(255,68,68,.12)', 'rgba(255,68,68,.4)', '🪜 STAIR ALERT'
    )
    setZone(result.position==='full'?'center':result.position||'center', 'on-red')

    const proximityMap = { immediate:1.0, close:0.65, far:0.3 }
    const prox = proximityMap[result.proximity] || 0.5
    const distLabels2 = { immediate:'RIGHT HERE — STOP!', close:'Very close — slow down', far:'Ahead — be careful' }
    setDist(prox, distLabels2[result.proximity]||'Ahead')

    const alertMsg = `Warning! ${result.warning}. ${result.proximity==='immediate'?'Stop immediately!':result.proximity==='close'?'Slow down!':''}`
    if (alertMsg !== lastInstMsg || result.proximity==='immediate') {
      speak(alertMsg, result.proximity==='immediate'?0.85:1.0, result.proximity==='immediate')
      lastInstMsg = alertMsg
    }
    lastStairState = 'detected'
    stairCooldown = true
    setTimeout(()=>stairCooldown=false, result.proximity==='immediate'?4000:2500)
  } else {
    hideHazard()
    if (lastStairState === 'detected') {
      setInstructor('✅', 'No stairs visible. Path looks clear ahead.', 'rgba(0,255,136,.06)', 'rgba(0,255,136,.2)', '🪜 STAIR WATCH')
      speak('Clear. No stairs visible.', 1.1, true)
      lastInstMsg = 'clear'
    } else {
      setInstructor('⬆️', 'Scanning for stairs… path looks clear.', 'rgba(255,255,255,.03)', 'rgba(255,255,255,.08)', '🪜 STAIR WATCH')
    }
    setZone(null)
    setDist(0, 'No stairs detected')
    lastStairState = 'clear'
    oc.clearRect(0,0,cvs.width,cvs.height)
  }
}

// ═══════════════════════════════════════════════════════════════════
// DOOR DETECTION — Claude Vision API
// ═══════════════════════════════════════════════════════════════════
let doorCooldown = false
let lastDoorState = null

async function detectDoor() {
  if (!vid.videoWidth || doorCooldown) return
  cvs.width=vid.videoWidth; cvs.height=vid.videoHeight
  oc.clearRect(0,0,cvs.width,cvs.height)

  const b64 = captureBase64()
  let result = null

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:250,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:b64 } },
            { type:'text', text:`You are an AI assistant for BLIND people. Analyze this camera frame for DOORS.

Respond ONLY with this JSON (no other text):
{"door":true/false,"position":"left"/"center"/"right","proximity":"immediate"/"close"/"far","state":"open"/"closed"/"ajar","type":"regular"/"glass"/"sliding"/"unknown","guidance":"navigation instruction max 12 words"}

If no door visible: {"door":false}
A door is: any hinged/sliding panel used for entry/exit. Include door frames, handles.` }
          ]
        }]
      })
    })
    const data = await resp.json()
    const txt = data.content?.[0]?.text?.trim() || ''
    result = JSON.parse(txt.replace(/```json|```/g,'').trim())
  } catch(e) {
    return
  }

  if (!result) return

  if (result.door) {
    // Draw door outline on overlay
    oc.save()
    const vw=cvs.width, vh=cvs.height
    const posMap = { left:[0, vw*0.4], center:[vw*0.2, vw*0.6], right:[vw*0.6, vw] }
    const [x1, x2] = posMap[result.position] || [vw*0.2, vw*0.8]
    const doorW = x2-x1, doorH=vh*0.75

    oc.strokeStyle = result.state==='open' ? '#60a5fa' : '#ffd700'
    oc.lineWidth = 3; oc.shadowBlur=15; oc.shadowColor=result.state==='open'?'#60a5fa':'#ffd700'
    oc.strokeRect(x1, vh*0.08, doorW, doorH)
    oc.fillStyle = result.state==='open' ? 'rgba(96,165,250,.08)' : 'rgba(255,215,0,.08)'
    oc.fillRect(x1, vh*0.08, doorW, doorH)

    // Door handle hint
    const handleX = result.position==='right' ? x1+doorW*0.12 : x1+doorW*0.82
    oc.beginPath()
    oc.arc(handleX, vh*0.08+doorH*0.5, 10, 0, Math.PI*2)
    oc.strokeStyle=result.state==='open'?'#60a5fa':'#ffd700'
    oc.lineWidth=2.5; oc.stroke()

    // State emoji
    const stateEmoji = { open:'🟢', closed:'🔒', ajar:'↔️' }
    oc.font=`${vh*0.06}px sans-serif`
    oc.fillText(stateEmoji[result.state]||'🚪', x1+doorW/2-20, vh*0.08+doorH*0.45)
    oc.restore()

    const isOpen = result.state === 'open' || result.state === 'ajar'
    const stateWord = result.state==='open'?'open':result.state==='ajar'?'slightly open':'closed'
    const instMsg = `Door is ${stateWord}, ${result.position}. ${result.guidance}.`

    setInstructor(
      isOpen ? '🚪' : '🔒',
      instMsg,
      isOpen ? 'rgba(96,165,250,.08)' : 'rgba(255,215,0,.08)',
      isOpen ? 'rgba(96,165,250,.35)' : 'rgba(255,215,0,.35)',
      `🚪 DOOR — ${result.type?.toUpperCase()||'DOOR'}`
    )

    const zone = result.position || 'center'
    setZone(zone, 'on-blue')

    const proxRatio = { immediate:0.95, close:0.6, far:0.25 }
    const proxWord = { immediate:'Right in front!', close:'Close — reach out', far:'Ahead of you' }
    setDist(proxRatio[result.proximity]||0.5, proxWord[result.proximity]||'Ahead')

    if (instMsg !== lastInstMsg) {
      speak(instMsg, 1.0)
      lastInstMsg = instMsg
    }

    lastDoorState = 'detected'
    doorCooldown = true
    setTimeout(()=>doorCooldown=false, 2800)
  } else {
    if (lastDoorState === 'detected') {
      setInstructor('🔍', 'Door no longer visible. Keep moving.', 'rgba(96,165,250,.05)', 'rgba(96,165,250,.15)', '🚪 DOOR SEARCH')
      speak('Door no longer in view. Keep searching.', 1.1, true)
      lastInstMsg = 'notfound'
    } else {
      setInstructor('🚶', 'No door visible yet. Keep moving forward.', 'rgba(255,255,255,.03)', 'rgba(255,255,255,.08)', '🚪 DOOR SEARCH')
    }
    setZone(null)
    setDist(0, 'No door detected')
    lastDoorState = 'notfound'
    oc.clearRect(0,0,cvs.width,cvs.height)
    hideHazard()
  }
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('load', loadModel)
</script>
